name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Playwright 1.61.1 / Ubuntu Noble, Linux amd64. Includes Chromium and OS libraries.
      image: mcr.microsoft.com/playwright@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
      options: --cpus 2 --memory 6g --memory-swap 6g
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Qualify the website with pinned tools
        run: bash scripts/ci-qualify.sh

      - name: Retain candidate and qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: website-${{ github.sha }}
          path: |
            apps/hashtree-cc/dist/
            apps/hashtree-cc/playwright-report/
            apps/hashtree-cc/test-results/
            ci-evidence/
          retention-days: 30
